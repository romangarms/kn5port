[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kn5port"
dynamic = ["version"]
description = "Convert Assetto Corsa tracks you own into BeamNG.drive levels, locally, for personal use"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=11.2", "pywebview>=5", "scipy>=1.8", "numba>=0.57"]

[project.scripts]
kn5port = "kn5port.cli:main"
kn5port-ui = "kn5port.cli:gui_main"

[project.gui-scripts]
kn5port-app = "kn5port.app:main"

[tool.setuptools.dynamic]
version = { attr = "kn5port.__version__" }   # bumped by packaging/release.py

[tool.setuptools]
packages = ["kn5port", "kn5port.ui", "kn5port.fh1_pipeline", "kn5port.fh1_fm4"]
package-dir = { "kn5port" = "kn5port", "kn5port.fh1_pipeline" = "fh1/pipeline", "kn5port.fh1_fm4" = "fh1/fm4" }

[tool.setuptools.package-data]
"kn5port.ui" = ["static/*"]
"kn5port.fh1_pipeline" = ["*.lua", "lzx.c", "fh1radio_app/*"]
