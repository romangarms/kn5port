[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kn5port"
version = "0.1.0"
description = "Convert Assetto Corsa tracks you own into BeamNG.drive levels, locally, for personal use"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9.0"]

[project.scripts]
kn5port = "kn5port.cli:main"
kn5port-ui = "kn5port.cli:gui_main"

[tool.setuptools]
packages = ["kn5port", "kn5port.ui"]

[tool.setuptools.package-data]
"kn5port.ui" = ["static/*"]
