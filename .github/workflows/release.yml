# Builds kn5port.exe on Windows for every tag like v0.2.0 and attaches it to a GitHub release.
# The exe contains only kn5port's own code (and Python/numpy/Pillow/pywebview): no game content.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install . pytest
          python -m pytest -q tests
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kn5port-exe
          path: dist/kn5port.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kn5port.exe
