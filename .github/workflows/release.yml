# Builds kn5port.exe on Windows for every tag like v0.2.0 and attaches it to a GitHub release.
# The exe contains only kn5port's own code (and Python/numpy/Pillow/pywebview): no game content.
# Keep the asset named kn5port.exe: the app's self-update (kn5port/update.py) downloads that name from the latest release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole history and tags, for the list of changes since the last release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches kn5port.__version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('kn5port/__init__.py').read())[1])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but __version__ is $v; cut releases with packaging/release.py"; exit 1; }
      - name: Test
        run: |
          python -m pip install . pytest
          python -m pytest -q tests
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kn5port-exe
          path: dist/kn5port.exe
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        # commits go straight to main, so GitHub's generated notes would be just a compare link: list the commits.
        # The app's update dialog shows these bullets (kn5port/update.py clean_notes drops the first line and links).
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo 'Download `kn5port.exe` below and run it. If you already have kn5port, it offers this update itself. Fully restart BeamNG after converting a track.'
            echo
            echo '## Changes'
            git log --no-merges --format='- %s' "${prev:+$prev..}$GITHUB_REF_NAME" | grep -vE '^- (Release v[0-9]|Update [A-Za-z_./-]+$)' || true
          } > notes.md
          cat notes.md
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kn5port.exe
          generate_release_notes: true          # appends the "Full Changelog" compare link
          body_path: notes.md
